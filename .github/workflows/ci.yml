name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: project_management_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend Build & Test Suite
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Lint Backend
        run: |
          cd backend
          npm run lint

      - name: Audit Backend Dependencies
        run: |
          cd backend
          npm audit --audit-level=high || true

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Run Backend Unit Tests
        run: |
          cd backend
          npm run test

      - name: Run Backend E2E Tests
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/project_management_system_test?schema=public
          JWT_ACCESS_SECRET: test-secret-access-key-123
          JWT_REFRESH_SECRET: test-secret-refresh-key-456
        run: |
          cd backend
          npx prisma db push --skip-generate
          npm run test:e2e

      - name: Build Backend
        run: |
          cd backend
          npm run build

      # Frontend Build & Linter Checks
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
